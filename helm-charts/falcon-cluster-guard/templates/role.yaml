{{- if .Values.admission.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-role
  namespace: {{ include "falcon-cluster-guard.namespace" . }}
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - watch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - watch
  - update
{{- if (include "falcon-cluster-guard.falconSecretEnabled" . | eq "true") }}
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
{{- end }}
{{- end }}
