{{- if .Values.admission.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-rolebinding
  namespace: {{ include "falcon-cluster-guard.namespace" . }}
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "falcon-cluster-guard.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "falcon-cluster-guard.admissionServiceAccountName" . }}
  namespace: {{ include "falcon-cluster-guard.namespace" . }}
{{- end }}
