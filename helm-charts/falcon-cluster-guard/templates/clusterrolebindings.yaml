# Binds the node-access-role to the node sensor ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-node-crb
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "falcon-cluster-guard.fullname" . }}-node-access-role
subjects:
- kind: ServiceAccount
  name: {{ include "falcon-cluster-guard.nodeServiceAccountName" . }}
  namespace: {{ include "falcon-cluster-guard.namespace" . }}
---
{{- if .Values.admission.enabled }}
# Binds the resource-reader role to the admission controller ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-admission-crb
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "falcon-cluster-guard.fullname" . }}-resource-reader
subjects:
- kind: ServiceAccount
  name: {{ include "falcon-cluster-guard.admissionServiceAccountName" . }}
  namespace: {{ include "falcon-cluster-guard.namespace" . }}
{{- end }}
