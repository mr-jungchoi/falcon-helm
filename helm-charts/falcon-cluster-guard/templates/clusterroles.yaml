apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-node-access-role
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  - secrets
  - services
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
{{- if and (include "falcon-cluster-guard.openshiftEnabled" . | eq "true") (not .Values.openshift.createSCC) .Values.openshift.nodeSCCName }}
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - {{ include "falcon-cluster-guard.nodeSccName" . }}
  verbs:
  - use
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "falcon-cluster-guard.fullname" . }}-resource-reader
  labels:
    {{- include "falcon-cluster-guard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-guard
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  - replicationcontrollers
  - secrets
  - services
  - configmaps
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "apps"
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "admissionregistration.k8s.io"
  resources:
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - clusterrolebindings
  - clusterroles
  - rolebindings
  - roles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "networking.k8s.io"
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "apiextensions.k8s.io"
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "gateway.networking.k8s.io"
  resources:
  - gatewayclasses
  - gateways
  - httproutes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "networking.istio.io"
  resources:
  - virtualservices
  verbs:
  - get
  - list
  - watch
