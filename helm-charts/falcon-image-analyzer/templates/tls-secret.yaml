{{- if and (or .Values.deployment.enabled .Values.daemonset.enabled) (not .Values.certManager.enabled) (not .Values.iarAgentService.existingTLSSecret) }}
{{- /* Agent service TLS certificate generated by Helm. Not rendered when cert-manager issues it
       (certificate.yaml) or when iarAgentService.existingTLSSecret names a Secret created outside the chart.
       With autoCertificateUpdate=false, the cert, key, and CA are reused together from the existing
       Secret so they keep matching; if any is missing, the whole set is regenerated. */}}
{{- $ns := include "falcon-image-analyzer.namespace" . }}
{{- $secretName := include "falcon-image-analyzer.tlsSecretName" . }}
{{- $existing := (lookup "v1" "Secret" $ns $secretName).data | default dict }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- $caCert := "" }}
{{- if and (not .Values.iarAgentService.autoCertificateUpdate) (hasKey $existing "tls.crt") (hasKey $existing "tls.key") (hasKey $existing "ca.crt") }}
{{- $tlsCert = index $existing "tls.crt" }}
{{- $tlsKey = index $existing "tls.key" }}
{{- $caCert = index $existing "ca.crt" }}
{{- else }}
{{- $certValid := (.Values.iarAgentService.certExpiration | int) }}
{{- $altNames := include "falcon-image-analyzer.iarDNSNames" . | fromYamlArray }}
{{- $ca := genCA (printf "%s ca" $ns) $certValid }}
{{- $cert := genSignedCert (first $altNames) nil $altNames $certValid $ca }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- $caCert = $ca.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-image-analyzer.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCert }}
{{- end }}
