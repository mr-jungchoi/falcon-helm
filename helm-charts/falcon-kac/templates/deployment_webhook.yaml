{{ include "validateValues" . }}
{{- $kacNS := include "falcon-kac.namespace" . -}}
{{- $myns := list }}
{{- if .Values.webhook.disableNamespaces }}
{{- $myns = split "," .Values.webhook.disableNamespaces }}
{{- end }}
{{- $certManager := .Values.certManager.enabled -}}
{{- $altNames := include "falcon-kac.webhookDNSNames" . | fromYamlArray -}}
{{- $webhookFullName := first $altNames -}}

{{- /* Webhook TLS has two sources:
       - certManager.enabled: certificate.yaml issues <name>-tls, and cainjector fills the caBundle.
       - otherwise Helm generates <name>-tls. With autoCertificateUpdate=false, the cert, key, and CA
         are reused together from the existing Secret so they keep matching; if any is missing, the
         whole set is regenerated. All values below are base64-encoded. */}}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- $caCert := "" }}
{{- if not $certManager }}
  {{- $existing := (lookup "v1" "Secret" $kacNS (include "falcon-kac.tlsSecretName" .)).data | default dict }}
  {{- if and (not .Values.autoCertificateUpdate) (hasKey $existing "tls.crt") (hasKey $existing "tls.key") (hasKey $existing "ca.crt") }}
    {{- $tlsCert = index $existing "tls.crt" }}
    {{- $tlsKey = index $existing "tls.key" }}
    {{- $caCert = index $existing "ca.crt" }}
  {{- else }}
    {{- $certValid := (.Values.certExpiration | int) }}
    {{- $ca := genCA (printf "%s ca" $kacNS) $certValid }}
    {{- $cert := genSignedCert $webhookFullName nil $altNames $certValid $ca }}
    {{- $tlsCert = $cert.Cert | b64enc }}
    {{- $tlsKey = $cert.Key | b64enc }}
    {{- $caCert = $ca.Cert | b64enc }}
  {{- end }}
{{- end }}
{{- $falconSecretEnabled := include "falcon-kac.falconSecretEnabled" . | eq "true" }}
{{- $falconSecretName := include "falcon-kac.falconSecretName" . }}
{{- $imagePullSecret := include "falcon-kac.imagePullSecret" . }}
{{- $registryConfigJson := include "falcon-kac.registryConfigJson" . }}
{{- if not $certManager }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "falcon-kac.tlsSecretName" . }}
  namespace: {{ $kacNS }}
  labels:
    {{- include "falcon-kac.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCert }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "falcon-kac.name" . }}
  namespace: {{ include "falcon-kac.namespace" . }}
  labels:
    {{- include "falcon-kac.labels" . | nindent 4 }}
    {{- if .Values.labels }}
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  {{- if .Values.annotations }}
  annotations:
    {{- range $key, $value := .Values.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "falcon-kac.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "falcon-kac.labels" . | nindent 8 }}
        {{- if .Values.labels }}
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        sensor.falcon-system.crowdstrike.com/injection: disabled
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        {{- if and (include "falcon-kac.openshiftEnabled" . | eq "true") .Values.hostNetwork }}
        openshift.io/scc: {{ include "falcon-kac.sccName" . }}
        {{- end }}
      {{- if or (.Values.autoDeploymentUpdate) (.Values.podAnnotations) }}
        {{- if .Values.autoDeploymentUpdate }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
    spec:
    {{- if and $imagePullSecret $registryConfigJson }}
      {{- fail "image.pullSecrets and image.registryConfigJSON cannot be used together." }}
    {{- else -}}
    {{- if or $imagePullSecret $registryConfigJson }}
      imagePullSecrets:
      {{- if $imagePullSecret }}
        - name: {{ $imagePullSecret }}
      {{- end }}
      {{- if $registryConfigJson }}
        - name: {{ include "falcon-kac.fullname" . }}-pull-secret
      {{- end }}
    {{- end }}
    {{- end }}
      containers:
      - name: falcon-client
        args:
        - client
        - "-port={{ .Values.webhookPort }}"
        env:
        - name: __CS_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: __CS_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: __CS_POD_NODENAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: HELM_CHART
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['helm.sh/chart']
        {{- if .Values.falconImageAnalyzerNamespace }}
        - name: __CS_IAR_NAMESPACE
          value: {{ .Values.falconImageAnalyzerNamespace | quote }}
        {{- end }}
        {{- if (include "falcon-kac.csiEnabled" .) | eq "true" }}
        - name: FALCONCTL_OPT_CID
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_CID
              optional: true
        {{- if .Values.secretsStore.provisioningTokenSecretName }}
        - name: FALCONCTL_OPT_PROVISIONING_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_PROVISIONING_TOKEN
              optional: true
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "falcon-kac.fullname" . }}-config
        {{- if and $falconSecretEnabled (not (include "falcon-kac.csiEnabled" . | eq "true")) }}
        - secretRef:
            name: {{ $falconSecretName }}
        {{- end }}
        image: {{ include "falcon-kac.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: {{ .Values.webhookPort }}
            scheme: HTTPS
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: {{ .Values.webhookPort }}
          name: webhook-port
        resources:
          {{- if .Values.admissionControl.enabled }}
          {{- toYaml .Values.falconClientResources | nindent 10 }}
          {{- else }}
          {{- toYaml .Values.falconClientNoWebhookResources | nindent 10 }}
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startz
            port: {{ .Values.webhookPort }}
            scheme: HTTPS
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /run/secrets/tls
          name: {{ include "falcon-kac.name" . }}-tls-certs
          readOnly: true
        - mountPath: /tmp
          name: crowdstrike-falcon-vol0
        - mountPath: /var/private
          name: crowdstrike-falcon-vol1
        {{- if (include "falcon-kac.csiEnabled" .) | eq "true" }}
        - name: csi-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
        {{- end }}
      - name: falcon-watcher
        args:
        - "client"
        - "-app=watcher"
        - "-http-port={{ .Values.watcherPort }}"
        env:
        - name: __CS_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: __CS_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: __CS_POD_NODENAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: HELM_CHART
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['helm.sh/chart']
        {{- if (include "falcon-kac.csiEnabled" .) | eq "true" }}
        - name: FALCONCTL_OPT_CID
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_CID
              optional: true
        {{- if .Values.secretsStore.provisioningTokenSecretName }}
        - name: FALCONCTL_OPT_PROVISIONING_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_PROVISIONING_TOKEN
              optional: true
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "falcon-kac.fullname" . }}-config
        {{- if and $falconSecretEnabled (not (include "falcon-kac.csiEnabled" . | eq "true")) }}
        - secretRef:
            name: {{ $falconSecretName }}
        {{- end }}
        image: {{ include "falcon-kac.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /livez
            port: {{ .Values.watcherPort }}
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 2
        ports:
        - containerPort: {{ .Values.watcherPort }}
          name: healthcheck
        resources:
          {{- toYaml .Values.falconWatcherResources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startz
            port: {{ .Values.watcherPort }}
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: crowdstrike-falcon-vol0
        - mountPath: /var/private
          name: crowdstrike-falcon-vol1
        - mountPath: /var/falcon-watcher
          name: crowdstrike-falcon-vol2
      - name: falcon-ac
        env:
        - name: HELM_CHART
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['helm.sh/chart']
        {{- if (include "falcon-kac.csiEnabled" .) | eq "true" }}
        - name: FALCONCTL_OPT_CID
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_CID
              optional: true
        {{- if .Values.secretsStore.provisioningTokenSecretName }}
        - name: FALCONCTL_OPT_PROVISIONING_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "falcon-kac.csiSecretName" . }}
              key: FALCONCTL_OPT_PROVISIONING_TOKEN
              optional: true
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "falcon-kac.fullname" . }}-config
        {{- if and $falconSecretEnabled (not (include "falcon-kac.csiEnabled" . | eq "true")) }}
        - secretRef:
            name: {{ $falconSecretName }}
        {{- end }}
        image: {{ include "falcon-kac.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez-kac
            port: {{ .Values.webhookPort }}
            scheme: HTTPS
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          {{- toYaml .Values.falconAcResources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startz-kac
            port: {{ .Values.webhookPort }}
            scheme: HTTPS
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: crowdstrike-falcon-vol0
        - mountPath: /var/private/
          name: crowdstrike-falcon-vol1
        - mountPath: /var/falcon-watcher
          name: crowdstrike-falcon-vol2
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ .Values.serviceAccount.name }}
      shareProcessNamespace: true
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ default "ClusterFirstWithHostNet" .Values.dnsPolicy }}
      {{- else if .Values.dnsPolicy}}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      volumes:
      - name: {{ include "falcon-kac.name" . }}-tls-certs
        secret:
          secretName: {{ include "falcon-kac.tlsSecretName" . }}
      - name: crowdstrike-falcon-vol0
        emptyDir:
          sizeLimit: 256Mi
      - name: crowdstrike-falcon-vol1
        emptyDir:
          sizeLimit: 4Ki
      - name: crowdstrike-falcon-vol2
        emptyDir:
          sizeLimit: 64Mi
      {{- if (include "falcon-kac.csiEnabled" .) | eq "true" }}
      - name: csi-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "falcon-kac.fullname" . }}-csi
      {{- end }}
---
{{- if .Values.admissionControl.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating.{{ include "falcon-kac.webhookName" . }}
  labels:
    {{- include "falcon-kac.labels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    {{- /* cert-manager's cainjector fills both webhooks' caBundle from the Certificate's CA */}}
    cert-manager.io/inject-ca-from: {{ $kacNS }}/{{ include "falcon-kac.tlsSecretName" . }}
  {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    {{- if not $certManager }}
    caBundle: {{ $caCert }}
    {{- end }}
    {{- if .Values.domainName }}
    url: https://{{ $webhookFullName }}:443/validate
    {{- else }}
    service:
      name: webhook
      namespace: {{ include "falcon-kac.namespace" . }}
      path: /validate
    {{- end }}
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  matchPolicy: Equivalent
  name: validating.{{ include "falcon-kac.webhookName" . }}
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - {{ include "falcon-kac.namespace" . }}
      - kube-system
      - kube-public
      - falcon-system
      - falcon-kubernetes-protection
      {{- if $myns }}
      {{- range $ns := $myns }}
      - {{ $ns }}
      {{- end -}}
      {{- end -}}
      {{ include "falcon-kac.openshiftNamespaces" . | nindent 6 }}
    - key: {{ include "falcon-kac.webhookName" . }}/admission-review
      operator: NotIn
      values:
      - disabled
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
    - pods/ephemeralcontainers
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    {{- if not $certManager }}
    caBundle: {{ $caCert }}
    {{- end }}
    {{- if .Values.domainName }}
    url: https://{{ $webhookFullName }}:443/validate
    {{- else }}
    service:
      name: webhook
      namespace: {{ include "falcon-kac.namespace" . }}
      path: /validate
    {{- end }}
  failurePolicy: Ignore
  matchPolicy: Equivalent
  name: workload.validating.{{ include "falcon-kac.webhookName" . }}
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - {{ include "falcon-kac.namespace" . }}
      - kube-system
      - kube-public
      - falcon-system
      - falcon-kubernetes-protection
      {{- if $myns }}
      {{- range $ns := $myns }}
      - {{ $ns }}
      {{- end -}}
      {{- end -}}
      {{ include "falcon-kac.openshiftNamespaces" . | nindent 6 }}
    - key: {{ include "falcon-kac.webhookName" . }}/admission-review
      operator: NotIn
      values:
      - disabled
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - replicationcontrollers
    - services
    scope: '*'
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cronjobs
    - jobs
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
{{- end }}
