# Default values for falcon-clusterguard.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Falcon Cluster Guard (FCG) is a unified Kubernetes security service that combines:
#   - Falcon node-sensor DaemonSet (kernel/eBPF endpoint protection)
#   - Falcon clusterguard-controller (validating webhook for K8s workloads + metadata service for visibility)
#
# The `image` block below is unified across both workloads - a single FCG container
# image is used by both the node DaemonSet and the clusterguard controller Deployment.

image:
  # Unified FCG container image (runs both node sensor and admission control modes)
  repository: registry.crowdstrike.com/falcon-clusterguard/release/falcon-clusterguard
  pullPolicy: Always

  # Registry authentication - configure ONE of the following:
  # pullSecret: name of an existing docker-registry Secret
  pullSecret:
  # registryConfigJSON: base64 of docker config.json; the chart creates the Secret for you.
  # $ cat ~/.docker/config.json | base64 -w 0
  registryConfigJSON:

  # Overrides the image tag. In general, tags should not be used (including semver tags or `latest`).
  # This variable is provided for those who have yet to move off of using tags. The sha256 digest
  # should be used in place of tags for increased security and image immutability.
  tag: "8.14.0-XXXXX-1"
  # Setting a digest will override any tag and should be used instead of tags.
  #
  # Example digest variable configuration:
  # digest: sha256:ffdc91f66ef8570bd7612cf19145563a787f552656f5eec43cd80ef9caca0398
  digest:

# =============================================================================
# Falcon CTL options (shared across node sensor and admission control)
# =============================================================================
# falcon.cid is required unless falconSecret.enabled is true and FALCONCTL_OPT_CID is
# defined in an existing secret referenced by falconSecret.secretName.
falcon:
  cid:
  cloud:
  apd:
  aph:
  app:
  trace: none         # needs to be configurable for each subcomponent
  feature:            # needs to be configurable for each subcomponent
  billing:
  tags:               # needs to be configurable for each subcomponent
  provisioning_token:

# If falcon.cid is not defined, falconSecret.enabled must be true, and FALCONCTL_OPT_CID
# must be defined in the referenced existing secret.
# When imageAnalyzer.enabled is true, the same secret must also contain AGENT_CLIENT_ID,
# AGENT_CLIENT_SECRET, and AGENT_CID. Credentials are not mixed across sources: with
# falconSecret, imageAnalyzer.crowdstrikeConfig.clientID/clientSecret must be empty.
falconSecret:
  enabled: false
  secretName: ""

# Secrets Store CSI Driver integration.
# Requires secrets-store-csi-driver and the appropriate provider addon to be installed.
# One block configures every FCG workload:
#   - Node sensor and clusterguard controller: FALCONCTL_OPT_CID (and optionally
#     FALCONCTL_OPT_PROVISIONING_TOKEN) are sourced from the secrets store rather than
#     from falcon.cid or falconSecret.
#   - Image Analyzer (when imageAnalyzer.enabled): AGENT_CLIENT_ID, AGENT_CLIENT_SECRET,
#     and AGENT_CID (unless global.falcon.cid is set).
# Auth wiring (pod labels, serviceAccount annotations) is provider-specific and left to the
# user via node/cluster/imageAnalyzer podLabels and serviceAccount.annotations.
secretsStore:
  # Component-level setting overrides global setting.
  enabled:

  # Provider: azure
  provider: ""

  # Name of the Kubernetes secret that will be created by the CSI driver for the node sensor
  # and clusterguard controller. The SecretProviderClass will sync secrets from the provider
  # into this Kubernetes secret. If empty, defaults to "<release-fullname>-csi".
  # The Image Analyzer secret is named "<secretName>-iar" when this (or
  # global.secretsStore.secretName) is set, otherwise "<release-fullname>-iar-csi".
  secretName: ""

  # Azure Key Vault
  # Required when provider: azure
  # Auth: set podLabels: {azure.workload.identity/use: "true"} and
  #       serviceAccount.annotations: {azure.workload.identity/client-id: "<id>"}
  azure:
    vaultName: ""
    tenantID: ""
    clientID: ""  # optional: workload identity client ID

  # Name of the secrets store secret containing the provisioning token
  # (FALCONCTL_OPT_PROVISIONING_TOKEN). Leave empty to omit.
  provisioningTokenSecretName: ""

# =============================================================================
# cert-manager integration (applies to every certificate the chart uses)
# =============================================================================
# When enabled, cert-manager issues all FCG TLS certificates instead of Helm generating them:
#   - clusterguard controller admission webhook (caBundle injected by cert-manager's cainjector)
#   - gRPC mTLS between the clusterguard controller and node sensors
#   - image analyzer agent service
# cluster.autoCertificateUpdate and imageAnalyzer.iarAgentService.autoCertificateUpdate are
# ignored; cert-manager handles renewal. Validity periods still come from cluster.certExpiration
# and imageAnalyzer.iarAgentService.certExpiration.
# Requires cert-manager (including cainjector) in the cluster and an issuerRef that can issue
# certificates for in-cluster service names, such as a self-signed or CA ClusterIssuer.
certManager:
  enabled: false
  issuerRef: {}
  #  name: selfsigned-cluster-issuer
  #  kind: ClusterIssuer

# =============================================================================
# Node sensor DaemonSet configuration
# =============================================================================
node:
  # When enabled, the chart deploys the FCG node sensor DaemonSet to all nodes.
  enabled: true

  # Falcon Cluster Guard can usually discover the clusterName automatically so setting clusterName here is normally
  # not necessary, but in some cases the clusterName cannot be discovered, e.g. for self-hosted
  # kubernetes clusters such as MicroK8s. In those cases, the clusterName can be manually set here.
  clusterName: ""

  # ServiceAccount for the node sensor DaemonSet and post-delete cleanup DaemonSet.
  # Bound to the privileged SCC on OpenShift (requires host access for kernel/eBPF sensor).
  serviceAccount:
    name: falcon-node-sensor-sa
    annotations: { }

  # Enable for use on Google's GKE Autopilot clusters
  gke:
    enabled: false
    autopilot: false
    # deployAllowListVersion: ""
    # cleanupAllowListVersion: ""

  daemonset:
    # Annotations to apply to the daemonset
    annotations: {}

    # The key that is used to handle enabling/disabling sensor injection at the pod/node level
    podAnnotationKey: sensor.falcon-system.crowdstrike.com/injection

    # Additional labels
    labels: {}

    # Enable the priorityClass creation on chart installation
    priorityClassCreate: false
    # Assign a PriorityClassName to pods if set
    priorityClassName: ""
    priorityClassValue: 1000000000

    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

    # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
    nodeAffinity: {}

    # Resource settings for the DaemonSet Sensor. Resource limits are not recommended when running in
    # kernel mode. Purposefully, the defaults are set to the minimum requirements. Depending on the
    # size of your cluster and the node types, you may need to increase these values.
    # resources:
    #   limits:
    #     cpu: 250m
    #     ephemeral-storage: 100Mi
    #     memory: 500Mi
    #   requests:
    #     cpu: 250m
    #     ephemeral-storage: 100Mi
    #     memory: 500Mi

    # Update strategy to roll out new daemonset configuration to the nodes.
    updateStrategy: RollingUpdate

    # Sets the max unavailable nodes. Default is 1 when no value exists.
    maxUnavailable: 1

  # Pod-level annotations for the node DaemonSet
  podAnnotations: {}

  # Pod-level labels for the node DaemonSet
  podLabels: {}

  # How long to wait for FCG pods to stop gracefully
  terminationGracePeriod: 60

  hooks:
    # Settings for the node post-delete helm hook
    postDelete:
      enabled: true

  # Enable to run cleanup for the prior daemonset deployment (skip main DaemonSet)
  cleanupOnly: false

  # Guardian Local Proxy configuration.
  # When enabled, a node-local falcon-proxy Service is created and the sensor container
  # exposes the proxy port. An optional CA trust bundle can be mounted for TLS verification
  # of upstream endpoints.
  guardian:
    proxy:
      enabled: false
      # Container port and Service port for the proxy.
      port: 48080
      # Name of an optional Secret containing CA certificate(s) for upstream TLS verification.
      # If the Secret does not exist, the proxy runs without a custom CA bundle.
      tlsSecretName: falcon-proxy-tls

  # Custom DNS configuration mapped directly to the pod spec dnsConfig field.
  # dnsPolicy is fixed to ClusterFirstWithHostNet and is not configurable
  # (the only policy that enables cluster DNS with hostNetwork: true).
  dnsConfig: {}
  #  nameservers:
  #    - "10.0.0.53"
  #  searches:
  #    - "corp.internal"
  #  options:
  #    - name: ndots
  #      value: "2"

# =============================================================================
# Cluster Guard controller configuration
# =============================================================================
cluster:
  # Toggle admission control (ValidatingWebhookConfiguration + webhook Service) on/off.
  # When false, the clusterguard controller Deployment still runs for K8s metadata visibility,
  # but does not act as a validating webhook.
  admissionControl:
    enabled: false

  # ServiceAccount for the clusterguard-controller Deployment.
  serviceAccount:
    name: falcon-cg-controller-sa
    annotations: {}

  # ResourceQuota for clusterguard-controller pods (scoped to system-cluster-critical PriorityClass)
  resourceQuota:
    pods: 2

  # Specifies if the clusterguard controller pod should use hostNetwork mode. This is required
  # in some scenarios such as when a custom CNI is in use where control plane nodes cannot
  # establish network communication with pods.
  hostNetwork: false

  # Configure the webhook Port (HTTPS)
  webhookPort: 4443

  # Configure the watcher Port (HTTP, internal)
  watcherPort: 4080

  # Define clusterguard controller pod DNS Policy. Follows cluster default when unset;
  # set to "ClusterFirstWithHostNet" automatically when hostNetwork = true unless overridden.
  dnsPolicy:

  # Auto update the TLS certificates every time there is a helm upgrade.
  # Set to `false` to preserve existing certs across upgrades. Covers the admission webhook cert
  # and the gRPC mTLS certs; each set is reused only if all of its Secrets still exist, otherwise
  # the whole set is regenerated together. Ignored when certManager.enabled=true.
  autoCertificateUpdate: true

  # Certificate validity duration in number of days
  certExpiration: 3650

  # For custom DNS configurations when .svc requires a domain for services.
  # For example if service.my-namespace.svc doesn't resolve and the cluster uses
  # service.my-namespace.svc.testing.io, you would add testing.io as the value below.
  domainName:

  # Minimum TLS version accepted by the webhook (TLS1.2 or TLS1.3). Optional.
  tlsVersionMinimum:

  webhook:
    # Ignore = misconfigured webhook allows admission requests through (recommended default)
    # Fail   = misconfigured webhook rejects admission requests (stricter, may block workloads)
    failurePolicy: Ignore
    # Comma separated list of namespaces in which to disable validation e.g. "test1,test2"
    disableNamespaces:

  # Resource limits for clusterguard controller containers
  resources:
    # falcon-client (webhook receiver) - when clusterguard controller is enabled
    client:
      limits:
        memory: 384Mi
      requests:
        cpu: 250m
        memory: 384Mi

    # falcon-client - lighter footprint when webhook is disabled (visibility-only mode)
    clientNoWebhook:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # falcon-watcher (K8s event streamer & metadata service)
    watcher:
      limits:
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 512Mi

    # falcon-ac (clusterguard controller decision engine)
    admissionController:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Scheduling controls for the clusterguard-controller Deployment
  tolerations: []

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64

  # Update Webhook and roll out new Deployment on helm upgrade (adds annotation to force restart)
  autoDeploymentUpdate: true

  # Annotations for the clusterguard-controller deployment
  annotations: {}

  # Additional labels for the clusterguard-controller deployment
  labels: {}

  # Pod-level annotations for clusterguard-controller pods
  podAnnotations: {}

  # Pod-level labels for clusterguard-controller pods
  podLabels: {}

# =============================================================================
# Cluster visibility settings (K8s metadata service)
# =============================================================================
# These variables control how FCG provides visibility into resources on your Kubernetes cluster.
  visibility:
    # FCG snapshots Kubernetes resources on a periodic basis and sends them to CrowdStrike cloud.
    # This enables long-living resources to be maintained in CrowdStrike cloud databases.
    resourceSnapshots:
      # If set to false, snapshots are not taken, and you may not see long-lived Kubernetes
      # resources in Falcon UI after about 7 days.
      enabled: true
      # The time interval between periodic snapshots. Default 22h is also the maximum.
      # Minimum is 30 minutes. Format is HHhMMm. Examples: 12h, 45m, 1h30m.
      interval: 22h

    # FCG watches the Kubernetes cluster continuously for any action - creation, updates and
    # deletion - on resources and sends events to the CrowdStrike cloud.
    resourceWatcher:
      # If set to false, FCG does not watch the Kubernetes cluster. The latest state of resources
      # will not be reflected in the Falcon UI until a resource snapshot is taken.
      enabled: true

    # FCG watches ConfigMaps by default. Redacts known sensitive patterns before sending.
    resourceConfigMap:
      # If set to false, ConfigMap events are not watched.
      enabled: true

# =============================================================================
# Image Analyzer configuration
# =============================================================================
# When imageAnalyzer.enabled is true, a falcon-imageanalyzer Deployment is added to this
# chart release in the same namespace as the rest of FCG.
imageAnalyzer:
  enabled: false

  # Workload type for the image analyzer:
  #   deployment — watcher mode. A single pod discovers running images through the Kubernetes
  #                API and pulls them from their registries. No host access.
  #   daemonset  — socket mode. A privileged pod on every node reads images directly from the
  #                container runtime socket. Requires crowdstrikeConfig.agentRuntime.
  mode: deployment

  serviceAccount:
    name: ""
    annotations: {}

  crowdstrikeConfig:
    enableKlogs: "false"
    clientID: ""
    clientSecret: ""
    agentRegion: "autodiscovery"
    agentMaxConsumerThreads: "1"
    # DaemonSet mode only. Container runtime on the nodes: docker, containerd, crio, or podman.
    agentRuntime: ""
    # DaemonSet mode only. Runtime socket, e.g. unix:///run/containerd/containerd.sock.
    # Defaults to the standard socket for agentRuntime.
    agentRuntimeSocket: ""

  # Namespace exclusions for IAR scanning — comma-separated list
  exclusions:
    namespace: ""
    registry: ""
    imageName: ""

  # Set to true to bypass Kubernetes network and use node/host network.
  hostNetwork: false

  # Pod DNS policy. Defaults to ClusterFirstWithHostNet when hostNetwork=true.
  dnsPolicy:

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  # DaemonSet mode only. Container security context. Supports privileged, allowPrivilegeEscalation,
  # runAsUser, and runAsGroup; other keys are ignored. The DaemonSet needs privileged access to the
  # container runtime socket, so any of these not set here defaults to:
  #   privileged: true, allowPrivilegeEscalation: true, runAsUser: 0, runAsGroup: 0
  # Deployment mode always uses a fixed, non-privileged security context.
  securityContext: {}

  resources: {}

  tolerations: []

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux

  priorityClassName: ""

  nodeSelector: {}

  # Watcher list page size
  watcher:
    listPageSize: 500

  # Log output: 1=stdout, 2=stderr
  log:
    output: 2
    verbosity: "info"

  # IAR agent service configuration
  iarAgentService:
    httpPort: 8001
    # Regenerate the IAR TLS certificate on every helm upgrade. Set to `false` to reuse the
    # existing certificate, key, and CA from the TLS Secret. Ignored when certManager.enabled=true.
    autoCertificateUpdate: true
    # Certificate validity in days (also used for the cert-manager Certificate duration)
    certExpiration: 3650
    domainName:

  # Private registry credentials for IAR scanning
  privateRegistries:
    credentials: ""
    autoDiscoverCredentials: true

  # Mandatory tmp working space mount for image storage
  volumes:
    - name: tmp-volume
      emptyDir:
        sizeLimit: 20Gi

  volumeMounts:
    - mountPath: /tmp
      name: tmp-volume

  # AKS: mount azure.json for registry auth
  azure:
    enabled: false
    azureConfig: /etc/kubernetes/azure.json

  # GCP GKE workload identity init container
  gcp:
    enabled: false

  proxyConfig:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    NO_PROXY: ""

# Deploys the test suite during install for testing purposes.
testing:
  enabled: false
  # Set to true to apply privileged PSS labels to the install namespace as a pre-install hook.
  labelNamespace: false

# Override various naming aspects of this chart
# Only edit these if you know what you're doing
nameOverride: ""
fullnameOverride: ""

# OpenShift configuration.
# NOTE: OpenShift is NOT A RECOMMENDED configuration. The official Red Hat certified operator
# (https://catalog.redhat.com/en/software/container-stacks/detail/62f2d38f76d039249424703d) is the
# recommended installation method for OpenShift clusters.
openshift:
  # Set to true to enable OpenShift compatibility mode.
  enabled: false
  # Set to true to create a privileged SCC for the node sensor DaemonSet,
  # and a hostNetwork SCC for the clusterguard controller Deployment.
  # Required for the node sensor to run as root with host access (hostPID, hostNetwork, hostIPC).
  # Only needed for clusterguard controller when cluster.hostNetwork=true.
  createSCC: true

  # Name of the node sensor SCC. Defaults to "<release-fullname>-node-sensor".
  nodeSCCName: ""

  # Name of the clusterguard controller SCC. Defaults to "<release-fullname>-cg-controller".
  cgControllerSCCName: ""

  # Name of the image analyzer SCC. Defaults to "<release-fullname>-iar".
  iarSCCName: ""

# Global values — used when falcon-clusterguard is deployed as a subchart of falcon-platform.
# These mirror the global values schema of the other falcon-platform subcharts.
# Chart-level values take precedence over globals when both are set.
global:
  falcon:
    cid:
  falconSecret:
    enabled: false
    secretName: ""
  containerRegistry:
    pullSecret: ""
    configJSON: ""
  openshift:
    enabled: false
    createSCC: true
  secretsStore:
    enabled: false
    provider: ""
    secretName: ""
    azure:
      vaultName: ""
      tenantID: ""
      clientID: ""
  # When deploying as a subchart, the parent chart sets this to its own chart name+version
  helmChart: ""
