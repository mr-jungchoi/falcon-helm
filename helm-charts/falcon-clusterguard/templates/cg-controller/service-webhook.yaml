{{- if eq (include "falcon-clusterguard.admissionControlEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- /* `app: falcon-kac` label is necessary for IAR to discover the KAC webhook service */}}
    app: falcon-kac
    {{- include "falcon-clusterguard.cgControllerLabelsWithoutSelector" . | nindent 4 }}
spec:
  selector:
    {{- include "falcon-clusterguard.cgControllerSelectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: webhook-port
{{- end }}
