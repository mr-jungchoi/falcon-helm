{{- if (eq (include "falcon-clusterguard.clusterGuardDisabled" .) "false") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "falcon-clusterguard.fullname" . }}-security-crb
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "falcon-clusterguard.fullname" . }}-resource-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "falcon-clusterguard.clusterServiceAccountName" . }}
    namespace: {{ include "falcon-clusterguard.namespace" . }}
{{- end }}
