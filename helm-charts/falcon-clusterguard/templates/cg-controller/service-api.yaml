{{- if (eq (include "falcon-clusterguard.clusterGuardDisabled" .) "false") }}
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "falcon-clusterguard.cgControllerSelectorLabels" . | nindent 4 }}
  type: ClusterIP
  ports:
    - port: 443
      targetPort: grpc-port
      protocol: TCP
      name: grpc-api
{{- end }}
