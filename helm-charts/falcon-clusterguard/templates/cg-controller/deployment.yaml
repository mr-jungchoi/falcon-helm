{{- if (eq (include "falcon-clusterguard.clusterGuardDisabled" .) "false") }}
  {{- $deploymentName := include "falcon-clusterguard.controllerName" . }}
  {{- $validatingWebhookName := printf "validating.%s" (include "falcon-clusterguard.webhookName" .) }}
  {{- $ns := include "falcon-clusterguard.namespace" . }}
  {{- $certValid := (.Values.cluster.certExpiration | int) }}
  {{- $certManager := .Values.certManager.enabled }}
  {{- $webhookAltNames := include "falcon-clusterguard.webhookDNSNames" . | fromYamlArray }}
  {{- $webhookFullName := first $webhookAltNames }}

  {{- /* Webhook TLS: CA + server cert for the ValidatingWebhook HTTPS endpoint.
       With certManager.enabled, certificate.yaml issues it and cainjector fills caBundle.
       With autoCertificateUpdate=false, the existing cert, key, and CA are reused together
       from the Secret, so they always match; if any is missing the whole set is regenerated. */}}
  {{- $webhookCA := dict "Cert" "" }}
  {{- $webhookCert := dict "Cert" "" "Key" "" }}
  {{- if not $certManager }}
    {{- $existing := (lookup "v1" "Secret" $ns "falcon-cg-controller-tls").data | default dict }}
    {{- if and (not .Values.cluster.autoCertificateUpdate) (hasKey $existing "tls.crt") (hasKey $existing "tls.key") (hasKey $existing "ca.crt") }}
      {{- $webhookCert = dict "Cert" (index $existing "tls.crt" | b64dec) "Key" (index $existing "tls.key" | b64dec) }}
      {{- $webhookCA = dict "Cert" (index $existing "ca.crt" | b64dec) }}
    {{- else }}
      {{- $webhookCA = genCA (printf "%s ca" $ns) $certValid }}
      {{- $webhookCert = genSignedCert $webhookFullName nil $webhookAltNames $certValid $webhookCA }}
    {{- end }}
  {{- end }}

  {{- /* gRPC mTLS: separate CA + server cert (falcon-api-tls) + client cert (falcon-node-sensor-tls).
       Skipped when certManager.enabled=true — Certificate CRs in certificate.yaml handle this instead.
       autoCertificateUpdate=false reuses all three Secrets together, or regenerates all three. */}}
  {{- $grpcCA := dict "Cert" "" "Key" "" }}
  {{- $grpcServerCert := dict "Cert" "" "Key" "" }}
  {{- $grpcClientCert := dict "Cert" "" "Key" "" }}
  {{- if not $certManager }}
    {{- $existingCA := (lookup "v1" "Secret" $ns "falcon-api-ca").data | default dict }}
    {{- $existingServer := (lookup "v1" "Secret" $ns "falcon-api-tls").data | default dict }}
    {{- $existingClient := (lookup "v1" "Secret" $ns "falcon-node-sensor-tls").data | default dict }}
    {{- if and (not .Values.cluster.autoCertificateUpdate) (hasKey $existingCA "ca.crt") (hasKey $existingServer "tls.crt") (hasKey $existingServer "tls.key") (hasKey $existingClient "tls.crt") (hasKey $existingClient "tls.key") }}
      {{- $grpcCA = dict "Cert" (index $existingCA "ca.crt" | b64dec) }}
      {{- $grpcServerCert = dict "Cert" (index $existingServer "tls.crt" | b64dec) "Key" (index $existingServer "tls.key" | b64dec) }}
      {{- $grpcClientCert = dict "Cert" (index $existingClient "tls.crt" | b64dec) "Key" (index $existingClient "tls.key" | b64dec) }}
    {{- else }}
      {{- $apiSvcName := "api" }}
      {{- $apiFullName := printf "%s.%s.svc" $apiSvcName $ns }}
      {{- $apiAltNames := list
          (printf "%s" $apiFullName)
          (printf "%s.cluster.local" $apiFullName)
          (printf "%s.%s" $apiSvcName $ns)
          (printf "%s" $apiSvcName) }}
      {{- $grpcCA = genCA (printf "%s-clusterguard ca" $ns) $certValid }}
      {{- $grpcServerCert = genSignedCert $apiFullName nil $apiAltNames $certValid $grpcCA }}
      {{- $grpcClientCert = genSignedCert "falcon-sensor-client" nil (list (printf "URI:spiffe://cluster.local/ns/%s/sa/falcon-sensor" $ns)) $certValid $grpcCA }}
    {{- end }}
  {{- end }}

  {{- $falconSecretEnabled := include "falcon-clusterguard.falconSecretEnabled" . | eq "true" }}
  {{- $falconSecretName := include "falcon-clusterguard.falconSecretName" . }}
  {{- $csiEnabled := include "falcon-clusterguard.csiEnabled" . | eq "true" }}
  {{- $imagePullSecret := include "falcon-clusterguard.imagePullSecret" . }}
  {{- $registryConfigJson := include "falcon-clusterguard.registryConfigJson" . }}
{{- /* With certManager.enabled, cert-manager writes these Secrets from certificate.yaml. */}}
{{- if not $certManager }}
apiVersion: v1
kind: Secret
metadata:
  name: falcon-cg-controller-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabelsWithoutSelector" . | nindent 4 }}
    {{- /* TODO: check if app: falcon-kac is necessary for the tls secret */}}
    app: falcon-kac
type: kubernetes.io/tls
data:
  tls.crt: {{ $webhookCert.Cert | b64enc }}
  tls.key: {{ $webhookCert.Key | b64enc }}
  ca.crt: {{ $webhookCA.Cert | b64enc }}

---
{{- /* Node sensor client cert — signed by the gRPC CA, separate from the webhook cert. */}}
apiVersion: v1
kind: Secret
metadata:
  name: falcon-node-sensor-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $grpcClientCert.Cert | b64enc }}
  tls.key: {{ $grpcClientCert.Key | b64enc }}

---
{{- /* gRPC server cert for falcon-watcher — signed by its own CA. */}}
apiVersion: v1
kind: Secret
metadata:
  name: falcon-api-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $grpcServerCert.Cert | b64enc }}
  tls.key: {{ $grpcServerCert.Key | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: falcon-api-ca
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $grpcCA.Cert | b64enc }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploymentName }}
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
    {{- range $key, $value := .Values.cluster.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- with .Values.cluster.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "falcon-clusterguard.cgControllerSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 8 }}
        {{- range $key, $value := .Values.cluster.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.cluster.podLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        sensor.falcon-system.crowdstrike.com/injection: disabled
        checksum/configmap: {{ include (print $.Template.BasePath "/cg-controller/configmap.yaml") . | sha256sum | quote }}
        {{- if and (include "falcon-clusterguard.openshiftEnabled" . | eq "true") .Values.cluster.hostNetwork }}
        openshift.io/scc: {{ include "falcon-clusterguard.cgControllerSccName" . }}
        {{- end }}
        {{- if .Values.cluster.autoDeploymentUpdate }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
        {{- range $key, $value := .Values.cluster.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if or $imagePullSecret $registryConfigJson }}
      imagePullSecrets:
        {{- if $imagePullSecret }}
        - name: {{ $imagePullSecret }}
        {{- end }}
        {{- if $registryConfigJson }}
        - name: {{ include "falcon-clusterguard.pullSecretName" . }}
        {{- end }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1234
      serviceAccountName: {{ include "falcon-clusterguard.clusterServiceAccountName" . }}
      shareProcessNamespace: true
      {{- with .Values.cluster.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cluster.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cluster.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ default "ClusterFirstWithHostNet" .Values.cluster.dnsPolicy }}
      {{- else if .Values.cluster.dnsPolicy }}
      dnsPolicy: {{ .Values.cluster.dnsPolicy }}
      {{- end }}
      containers:
        - name: falcon-client
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - client
            - "-port={{ .Values.cluster.webhookPort }}"
          env:
            {{- /* TODO: Remove __CS_IAR_NAMESPACE, only needed temporarily for testing */}}
            - name: __CS_IAR_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: __CS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: __CS_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: __CS_POD_NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            {{- if $csiEnabled }}
            {{- include "falcon-clusterguard.csiEnvVars" . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.cgControllerConfigMapName" . }}
            {{- if and $falconSecretEnabled (not $csiEnabled) }}
            - secretRef:
                name: {{ $falconSecretName }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.cluster.webhookPort }}
              name: webhook-port
          resources:
            {{- if eq (include "falcon-clusterguard.admissionControlEnabled" .) "true" }}
            {{- toYaml .Values.cluster.resources.client | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.cluster.resources.clientNoWebhook | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: falcon-cg-controller-tls-certs
              mountPath: /run/secrets/tls
              readOnly: true
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
            {{- if $csiEnabled }}
            - name: csi-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
        - name: falcon-watcher
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - "client"
            - "-app=watcher"
            - "-http-port={{ .Values.cluster.watcherPort }}"
          env:
            - name: __CS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: __CS_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: __CS_POD_NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            {{- if $csiEnabled }}
            {{- include "falcon-clusterguard.csiEnvVars" . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.cgControllerConfigMapName" . }}
            {{- if and $falconSecretEnabled (not $csiEnabled) }}
            - secretRef:
                name: {{ $falconSecretName }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.cluster.watcherPort }}
              name: healthcheck
            - containerPort: 50051
              name: grpc-port
              protocol: TCP
          resources:
            {{- toYaml .Values.cluster.resources.watcher | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz
              port: {{ .Values.cluster.watcherPort }}
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /livez
              port: {{ .Values.cluster.watcherPort }}
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          volumeMounts:
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
            - name: crowdstrike-falcon-vol2
              mountPath: /var/falcon-watcher
            - name: falcon-api-tls-certs
              mountPath: /run/secrets/tls
              readOnly: true
            - name: falcon-api-ca
              mountPath: /run/secrets/ca
              readOnly: true
        - name: falcon-ac
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if $csiEnabled }}
          env:
            {{- include "falcon-clusterguard.csiEnvVars" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.cgControllerConfigMapName" . }}
          {{- if and $falconSecretEnabled (not $csiEnabled) }}
            - secretRef:
                name: {{ $falconSecretName }}
          {{- end }}
          resources:
            {{- toYaml .Values.cluster.resources.admissionController | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz-kac
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez-kac
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
            - name: crowdstrike-falcon-vol2
              mountPath: /var/falcon-watcher
      volumes:
        - name: falcon-cg-controller-tls-certs
          secret:
            secretName: falcon-cg-controller-tls
        - name: falcon-api-tls-certs
          secret:
            secretName: falcon-api-tls
        - name: falcon-api-ca
          secret:
            {{- if $certManager }}
            {{- /* The cert-manager CA Secret (falcon-grpc-ca) holds the CA private key, so take only
                 the CA certificate that cert-manager copies into the leaf Secret. */}}
            secretName: falcon-api-tls
            items:
              - key: ca.crt
                path: ca.crt
            {{- else }}
            secretName: falcon-api-ca
            {{- end }}
        - name: crowdstrike-falcon-vol0
          emptyDir:
            sizeLimit: 256Mi
        - name: crowdstrike-falcon-vol1
          emptyDir:
            sizeLimit: 4Ki
        - name: crowdstrike-falcon-vol2
          emptyDir:
            sizeLimit: 64Mi
        {{- if $csiEnabled }}
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "falcon-clusterguard.fullname" . }}-csi
        {{- end }}

---
{{- if eq (include "falcon-clusterguard.admissionControlEnabled" .) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $validatingWebhookName }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    {{- /* cert-manager's cainjector fills both webhooks' caBundle from the Certificate's CA */}}
    cert-manager.io/inject-ca-from: {{ $ns }}/falcon-cg-controller-tls
  {{- end }}
webhooks:
  - name: {{ $validatingWebhookName }}
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ $ns }}
            - kube-system
            - kube-public
            - falcon-system
            - falcon-kubernetes-protection
            - falcon-platform
            {{- if .Values.cluster.webhook.disableNamespaces }}
            {{- range splitList "," .Values.cluster.webhook.disableNamespaces }}
            - {{ . | trim }}
            {{- end }}
            {{- end }}
            {{ include "falcon-clusterguard.openshiftNamespaces" . | nindent 12 }}
        - key: {{ include "falcon-clusterguard.webhookName" . }}/admission-review
          operator: NotIn
          values:
            - disabled
    clientConfig:
      {{- if not $certManager }}
      caBundle: {{ $webhookCA.Cert | b64enc }}
      {{- end }}
      {{- if .Values.cluster.domainName }}
      url: https://{{ $webhookFullName }}:443/validate
      {{- else }}
      service:
        name: webhook
        namespace: {{ $ns }}
        path: /validate
      {{- end }}
    failurePolicy: {{ .Values.cluster.webhook.failurePolicy }}
    rules:
      - apiGroups:
        - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
        scope: '*'
    sideEffects: None
    timeoutSeconds: 10
  - name: workload.{{ $validatingWebhookName }}
    admissionReviewVersions:
    - v1
    clientConfig:
      {{- if not $certManager }}
      caBundle: {{ $webhookCA.Cert | b64enc }}
      {{- end }}
      {{- if .Values.cluster.domainName }}
      url: https://{{ $webhookFullName }}:443/validate
      {{- else }}
      service:
        name: webhook
        namespace: {{ $ns }}
        path: /validate
      {{- end }}
    failurePolicy: Ignore
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ $ns }}
            - kube-system
            - kube-public
            - falcon-system
            - falcon-kubernetes-protection
            - falcon-platform
            {{- if .Values.cluster.webhook.disableNamespaces }}
            {{- range splitList "," .Values.cluster.webhook.disableNamespaces }}
            - {{ . | trim }}
            {{- end }}
            {{- end }}
            {{- include "falcon-clusterguard.openshiftNamespaces" . | nindent 12 }}
        - key: {{ include "falcon-clusterguard.webhookName" . }}/admission-review
          operator: NotIn
          values:
            - disabled
    rules:
    - apiGroups:
        - ""
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - replicationcontrollers
        - services
      scope: '*'
    - apiGroups:
        - apps
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - daemonsets
        - deployments
        - replicasets
        - statefulsets
      scope: '*'
    - apiGroups:
        - batch
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - cronjobs
        - jobs
      scope: '*'
    sideEffects: None
    timeoutSeconds: 10
  {{- end }}
{{- end }}
