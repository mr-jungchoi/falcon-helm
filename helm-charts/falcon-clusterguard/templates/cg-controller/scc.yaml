{{- if and (include "falcon-clusterguard.openshiftEnabled" . | eq "true") (include "falcon-clusterguard.openshiftCgControllerSCCName" . | eq "true") }}
{{- /* SCC for the admission controller Deployment — only needed when admission.hostNetwork=true.*/}}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "falcon-clusterguard.cgControllerSccName" . }}
  labels:
    {{- include "falcon-clusterguard.cgControllerLabels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Grants the Falcon Cluster Guard controller hostNetwork access.
      Only required when cluster.hostNetwork=true (e.g. custom CNI environments).
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: true
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1
      max: 65535
readOnlyRootFilesystem: true
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 1
      max: 65535
users:
  - system:serviceaccount:{{ include "falcon-clusterguard.namespace" . }}:{{ include "falcon-clusterguard.clusterServiceAccountName" . }}
groups: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
{{- end }}
