{{- if .Values.node.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "falcon-clusterguard.fullname" . }}-node-crb
  labels:
    {{- include "falcon-clusterguard.falconSensorAppLabel" . | nindent 4 }}
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "falcon-clusterguard.fullname" . }}-node-access-role
subjects:
  - kind: ServiceAccount
    name: {{ include "falcon-clusterguard.nodeServiceAccountName" . }}
    namespace: {{ include "falcon-clusterguard.namespace" . }}
{{- end }}