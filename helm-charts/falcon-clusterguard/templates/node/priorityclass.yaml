{{- if and .Values.node.enabled (not .Values.node.cleanupOnly) }}
{{- if or .Values.node.daemonset.priorityClassCreate .Values.gke.autopilot }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "falcon-clusterguard.priorityClassName" . }}
  labels:
    {{- include "falcon-clusterguard.falconSensorAppLabel" . | nindent 4 }}
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
value: {{ .Values.node.daemonset.priorityClassValue }}
globalDefault: false
description: "Priority class for the CrowdStrike Falcon Cluster Guard node sensor DaemonSet on GKE Autopilot clusters."
{{- end }}
{{- end }}
