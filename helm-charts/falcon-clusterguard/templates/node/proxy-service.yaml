{{- if and .Values.node.enabled (not .Values.node.cleanupOnly) .Values.node.guardian.proxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: falcon-proxy
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "falcon-clusterguard.nodeSelectorLabels" . | nindent 4 }}
  # Local routing ensures each client pod reaches only the proxy on its own node.
  internalTrafficPolicy: Local
  ports:
  - name: proxy
    port: 80
    targetPort: proxy
    protocol: TCP
{{- end }}
