{{- if .Values.node.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "falcon-clusterguard.fullname" . }}-node-access-role
  labels:
    {{- include "falcon-clusterguard.falconSensorAppLabel" . | nindent 4 }}
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
rules:
- apiGroups:
    - ""
  resources:
    - namespaces
    - nodes
    - pods
    - secrets
    - services
  verbs:
    - get
    - list
    - watch
{{- if and (include "falcon-clusterguard.openshiftEnabled" . | eq "true") (not (include "falcon-clusterguard.openshiftNodeCreateSCC" . | eq "true")) .Values.openshift.nodeSCCName }}
- apiGroups:
    - security.openshift.io
  resources:
    - securitycontextconstraints
  resourceNames:
    - {{ include "falcon-clusterguard.nodeSccName" . }}
  verbs:
    - use
{{- end }}
{{- end }}
