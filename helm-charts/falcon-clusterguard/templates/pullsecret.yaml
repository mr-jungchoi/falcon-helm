{{- $registryConfigJson := include "falcon-clusterguard.registryConfigJson" . }}
{{- if or $registryConfigJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "falcon-clusterguard.pullSecretName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $registryConfigJson }}
{{- end }}
