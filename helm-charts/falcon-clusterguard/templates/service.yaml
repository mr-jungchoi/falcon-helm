{{- if eq (include "falcon-clusterguard.admissionControlEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    app: falcon-kac
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
spec:
  selector:
    {{- include "falcon-clusterguard.clusterguardSelectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: webhook-port
{{- end }}
