{{- if and .Values.nodeSensor.enabled (not .Values.nodeSensor.cleanupOnly) }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "falcon-clusterguard.nodeConfigMapName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.falconSensorAppLabel" . | nindent 4 }}
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
data:
  HELM_CHART: {{ include "falcon-clusterguard.helmChart" . | quote }}
  FALCON_MODE: daemonset
  __CS_ENABLE_K8S_METADATA_SERVICE: "true"

  {{- if not (include "falcon-clusterguard.falconSecretEnabled" . | eq "true") }}
  FALCONCTL_OPT_CID: {{ include "falcon-clusterguard.falconCid" . | quote }}
  {{- if .Values.falcon.provisioning_token }}
  FALCONCTL_OPT_PROVISIONING_TOKEN: {{ .Values.falcon.provisioning_token | quote }}
  {{- end }}
  {{- end }}

  {{- with include "falcon-clusterguard.falconctlOptions" (dict "root" . "component" .Values.nodeSensor) | trim }}
  {{- . | nindent 2 }}
  {{- end }}

  {{- if .Values.clusterName }}
  FALCON_CLUSTER_NAME: {{ .Values.clusterName | quote }}
  {{- end }}
{{- end }}
