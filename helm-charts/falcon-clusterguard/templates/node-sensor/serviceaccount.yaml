{{- if and .Values.nodeSensor.enabled (not .Values.nodeSensor.cleanupOnly) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "falcon-clusterguard.nodeServiceAccountName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.nodeLabels" . | nindent 4 }}
  {{- if .Values.nodeSensor.serviceAccount.annotations }}
  annotations: {{ toYaml .Values.nodeSensor.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}