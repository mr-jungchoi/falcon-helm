{{- $imageAnalyzer := .Values.imageAnalyzer }}
{{- /* With certManager.enabled, image-analyzer/certificate.yaml has cert-manager write this Secret. */}}
{{- if and $imageAnalyzer.enabled (not .Values.certManager.enabled) }}
{{- $iarNamespace := include "falcon-clusterguard.namespace" . }}
{{- $secretName := printf "%s-tls" (include "falcon-clusterguard.iarName" .) }}
{{- $certValid := ($imageAnalyzer.iarAgentService.certExpiration | int) -}}
{{- /* With autoCertificateUpdate=false, reuse the cert, key, and CA together from the existing
     Secret so they keep matching; if any is missing, regenerate the whole set. */}}
{{- $existing := (lookup "v1" "Secret" $iarNamespace $secretName).data | default dict }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- $caCert := "" }}
{{- if and (not $imageAnalyzer.iarAgentService.autoCertificateUpdate) (hasKey $existing "tls.crt") (hasKey $existing "tls.key") (hasKey $existing "ca.crt") }}
{{- $tlsCert = index $existing "tls.crt" }}
{{- $tlsKey = index $existing "tls.key" }}
{{- $caCert = index $existing "ca.crt" }}
{{- else }}
{{- $altNames := include "falcon-clusterguard.iarDNSNames" . | fromYamlArray }}
{{- $ca := genCA ( printf "%s ca" $iarNamespace ) $certValid -}}
{{- $cert := genSignedCert (first $altNames) nil $altNames $certValid $ca -}}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- $caCert = $ca.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCert }}
{{- end }}
