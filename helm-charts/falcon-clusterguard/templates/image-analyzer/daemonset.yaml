{{- if and .Values.imageAnalyzer.enabled (include "falcon-clusterguard.iarDaemonsetEnabled" . | eq "true") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "falcon-clusterguard.iarName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
    # KAC protects the IAR workload and its pods by this label while install
    # guard is armed.
    crowdstrike.com/install-guard-target: iar
spec:
  selector:
    matchLabels:
      {{- include "falcon-clusterguard.iarSelectorLabels" . | nindent 6 }}
  template:
    {{- include "falcon-clusterguard.iarPodTemplate" . | nindent 4 }}
{{- end }}
