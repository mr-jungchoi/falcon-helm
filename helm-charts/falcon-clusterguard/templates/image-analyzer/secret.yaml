{{- if .Values.imageAnalyzer.enabled }}
{{- /* Values mode only: falconSecret and secretsStore supply all three keys themselves. */ -}}
{{- if include "falcon-clusterguard.iarShouldCreateClientCredsInSecret" . | trim | eq "true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "falcon-clusterguard.iarFullname" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
  {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
data:
  AGENT_CLIENT_ID: {{ .Values.imageAnalyzer.crowdstrikeConfig.clientID | b64enc | quote }}
  AGENT_CLIENT_SECRET: {{ .Values.imageAnalyzer.crowdstrikeConfig.clientSecret | b64enc | quote }}
  AGENT_CID: {{ (include "falcon-clusterguard.falconCid" .) | b64enc | quote }}
{{- end }}
{{- end }}
