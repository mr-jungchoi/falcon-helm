{{- if and .Values.imageAnalyzer.enabled (include "falcon-clusterguard.iarDaemonsetEnabled" . | eq "false") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "falcon-clusterguard.iarName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "falcon-clusterguard.iarSelectorLabels" . | nindent 6 }}
  template:
    {{- include "falcon-clusterguard.iarPodTemplate" . | nindent 4 }}
{{- end }}
