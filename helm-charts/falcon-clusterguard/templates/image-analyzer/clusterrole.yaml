{{- if .Values.imageAnalyzer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "falcon-clusterguard.iarName" . }}
  labels:
  {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - pods
    - secrets
    - services
    - namespaces
    - nodes
    verbs:
    - get
    - watch
    - list
{{- if and (include "falcon-clusterguard.openshiftEnabled" . | eq "true") (not (include "falcon-clusterguard.openshiftIARCreateSCC" . | eq "true")) .Values.openshift.iarSCCName }}
  - apiGroups:
    - security.openshift.io
    resources:
    - securitycontextconstraints
    resourceNames:
    - {{ include "falcon-clusterguard.iarSCCName" . }}
    verbs:
    - use
{{- end }}
{{- end }}
