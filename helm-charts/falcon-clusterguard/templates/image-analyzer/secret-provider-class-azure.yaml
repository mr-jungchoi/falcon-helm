{{- $imageAnalyzer := .Values.imageAnalyzer }}
{{- if $imageAnalyzer.enabled }}
{{- if and (include "falcon-clusterguard.csiEnabled" . | eq "true") (eq (include "falcon-clusterguard.csiProvider" .) "azure") }}
{{- if include "falcon-clusterguard.falconSecretEnabled" . | eq "true" }}
  {{- fail "secretsStore and falconSecret cannot be used together. Use one secret source." }}
{{- end }}
{{- if and $imageAnalyzer.crowdstrikeConfig.clientID $imageAnalyzer.crowdstrikeConfig.clientSecret }}
  {{- fail "secretsStore and imageAnalyzer.crowdstrikeConfig.clientID/clientSecret cannot be used together. Use one secret source." }}
{{- end }}
{{- if include "falcon-clusterguard.falconCid" . }}
  {{- fail "secretsStore and falcon.cid cannot be used together. The Image Analyzer CID is read from the falcon-cid secret." }}
{{- end }}
{{- $vaultName := .Values.secretsStore.azure.vaultName | default .Values.global.secretsStore.azure.vaultName }}
{{- if not $vaultName }}
  {{- fail "secretsStore.azure.vaultName (or global.secretsStore.azure.vaultName) is required when provider is azure." }}
{{- end }}
{{- $tenantID := .Values.secretsStore.azure.tenantID | default .Values.global.secretsStore.azure.tenantID }}
{{- if not $tenantID }}
  {{- fail "secretsStore.azure.tenantID (or global.secretsStore.azure.tenantID) is required when provider is azure." }}
{{- end }}
{{- $clientID := .Values.secretsStore.azure.clientID | default .Values.global.secretsStore.azure.clientID }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "falcon-clusterguard.iarName" . }}-csi
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.iarLabels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    {{- if $clientID }}
    clientID: {{ $clientID | quote }}
    {{- end }}
    keyvaultName: {{ $vaultName | quote }}
    tenantId: {{ $tenantID | quote }}
    objects: |
      array:
        - |
          objectName: "falcon-client-id"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "falcon-client-secret"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "falcon-cid"
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: {{ include "falcon-clusterguard.iarCsiSecretName" . }}
      type: Opaque
      data:
        - objectName: "falcon-client-id"
          key: AGENT_CLIENT_ID
        - objectName: "falcon-client-secret"
          key: AGENT_CLIENT_SECRET
        - objectName: "falcon-cid"
          key: AGENT_CID
{{- end }}
{{- end }}
