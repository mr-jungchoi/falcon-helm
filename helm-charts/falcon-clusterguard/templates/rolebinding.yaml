{{- if .Values.cluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "falcon-clusterguard.fullname" . }}-rolebinding
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "falcon-clusterguard.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "falcon-clusterguard.clusterServiceAccountName" . }}
  namespace: {{ include "falcon-clusterguard.namespace" . }}
{{- end }}
