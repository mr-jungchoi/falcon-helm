{{- if and .Values.testing.enabled (include "falcon-clusterguard.falconSecretEnabled" . | eq "true") (not (include "falcon-clusterguard.csiEnabled" . | eq "true")) -}}
{{- $secretName := include "falcon-clusterguard.falconSecretName" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "falcon-clusterguard.fullname" . }}-test-existing-secret"
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    sensor.falcon-system.crowdstrike.com/injection: disabled
spec:
  containers:
    - name: kubectl
      image: docker.io/bitnami/kubectl
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          {{- include "falcon-clusterguard.testShellFunctions" . | nindent 10 }}
          SECRET="{{ $secretName }}"

          # check_env_from <kind> <name> <containers...>: every container loads the existing secret via envFrom.
          check_env_from() {
            KIND="$1"; NAME="$2"; shift 2
            for CONTAINER in "$@"; do
              check_equal "${KIND} '${NAME}' container '${CONTAINER}' envFrom Secret" \
                "$(kubectl get "${KIND}" "${NAME}" -n "${NS}" \
                  -o jsonpath="{.spec.template.spec.containers[?(@.name==\"${CONTAINER}\")].envFrom[?(@.secretRef.name==\"${SECRET}\")].secretRef.name}" 2>&1)" \
                "${SECRET}"
            done
          }

          echo "--- Checking existing secret '${SECRET}' ---"
          {{- /* falconSecret supplies every credential: the CID for the node sensor and controller,
                 and all three IAR keys (client credentials in values are rejected with falconSecret). */}}
          check_secret_keys "${SECRET}" FALCONCTL_OPT_CID{{ if .Values.imageAnalyzer.enabled }} AGENT_CLIENT_ID AGENT_CLIENT_SECRET AGENT_CID{{ end }}

          echo "--- Checking workloads load the existing secret ---"
          {{- if and .Values.node.enabled (not .Values.node.cleanupOnly) }}
          check_env_from daemonset "{{ include "falcon-clusterguard.nodeDaemonsetName" . }}" falcon-node-sensor
          {{- end }}
          {{- if eq (include "falcon-clusterguard.clusterGuardDisabled" .) "false" }}
          check_env_from deployment "{{ include "falcon-clusterguard.controllerName" . }}" falcon-client falcon-watcher falcon-ac
          {{- end }}
          {{- if .Values.imageAnalyzer.enabled }}
          check_env_from {{ ternary "daemonset" "deployment" (include "falcon-clusterguard.iarDaemonsetEnabled" . | eq "true") }} \
            "{{ include "falcon-clusterguard.iarName" . }}" "{{ include "falcon-clusterguard.iarName" . }}"
          # The chart only creates the IAR credentials Secret when the credentials are in values.
          check_absent secret "{{ include "falcon-clusterguard.iarName" . }}"
          {{- end }}

          finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]
  serviceAccountName: {{ include "falcon-clusterguard.fullname" . }}-test-sa
  restartPolicy: Never
{{- end -}}
