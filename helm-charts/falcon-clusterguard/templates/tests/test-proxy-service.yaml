{{- if and .Values.testing.enabled .Values.node.enabled (not .Values.node.cleanupOnly) .Values.node.guardian.proxy.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "falcon-clusterguard.fullname" . }}-test-proxy-service"
  namespace: {{ include "falcon-clusterguard.namespace" . }}
  labels:
    {{- include "falcon-clusterguard.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    sensor.falcon-system.crowdstrike.com/injection: disabled
spec:
  containers:
    - name: kubectl
      image: docker.io/bitnami/kubectl
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          {{- include "falcon-clusterguard.testShellFunctions" . | nindent 10 }}

          echo "--- Checking falcon-proxy Service ---"
          check_exists service falcon-proxy
          check_equal "falcon-proxy internalTrafficPolicy" \
            "$(kubectl get service falcon-proxy -n "${NS}" -o jsonpath='{.spec.internalTrafficPolicy}' 2>&1)" "Local"
          check_endpoints falcon-proxy

          echo "--- Checking proxy port on node sensor pods ---"
          check_rollout daemonset "{{ include "falcon-clusterguard.nodeDaemonsetName" . }}"
          check_pods_running "node sensor" "{{ include "falcon-clusterguard.testLabelSelector" (include "falcon-clusterguard.nodeSelectorLabels" .) }}"
          check_pods "proxy containerPort" \
            "{.spec.containers[?(@.name==\"falcon-node-sensor\")].ports[?(@.name==\"proxy\")].containerPort}" "{{ .Values.node.guardian.proxy.port }}"

          finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]
  serviceAccountName: {{ include "falcon-clusterguard.fullname" . }}-test-sa
  restartPolicy: Never
{{- end -}}
