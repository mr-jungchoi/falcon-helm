{{- if .Values.cluster.enabled }}
{{- $name := include "falcon-clusterguard.name" . -}}
{{- $ns := include "falcon-clusterguard.namespace" . -}}
{{- $certValid := (.Values.cluster.certExpiration | int) -}}

{{/* Webhook TLS: CA + server cert for the ValidatingWebhook HTTPS endpoint */}}
{{- $svcName := "webhook" -}}
{{- $webhookFullName := printf "%s.%s.svc" $svcName $ns -}}
{{- if .Values.cluster.domainName -}}
{{- $webhookFullName = printf "%s.%s.svc.%s" $svcName $ns .Values.cluster.domainName -}}
{{- end -}}
{{- $webhookAltNames := list
    (printf "%s" $webhookFullName)
    (printf "%s.cluster.local" $webhookFullName)
    (printf "%s.%s" $svcName $ns)
    (printf "%s" $svcName) -}}
{{- $webhookCA := genCA (printf "%s ca" $ns) $certValid -}}
{{- $webhookCert := genSignedCert $webhookFullName nil $webhookAltNames $certValid $webhookCA -}}
{{- if not .Values.cluster.autoCertificateUpdate -}}
{{- $tlscrt := (lookup "v1" "Secret" $ns "falcon-cluster-sensor-tls").data -}}
{{- if kindIs "map" $tlscrt -}}
{{- $webhookCert = dict "Cert" (index $tlscrt "tls.crt" | b64dec) "Key" (index $tlscrt "tls.key" | b64dec) -}}
{{- end -}}
{{- $tlsca := (lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" $ns $name).webhooks -}}
{{- if kindIs "slice" $tlsca -}}
{{- range $tlsca -}}
{{- $webhookCA = dict "Cert" (.clientConfig.caBundle | b64dec) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $tlsCert := $webhookCert.Cert | b64enc -}}
{{- $tlsKey := $webhookCert.Key | b64enc -}}
{{- $caCert := $webhookCA.Cert | b64enc -}}

{{/* gRPC mTLS: separate CA + server cert (falcon-api-tls) + client cert (falcon-node-sensor-tls).
     Skipped when certManager.enabled=true — Certificate CRs in certificate.yaml handle this instead. */}}
{{- $grpcCACert := "" -}}
{{- $grpcServerCrt := "" -}}
{{- $grpcServerKey := "" -}}
{{- $grpcClientCrt := "" -}}
{{- $grpcClientKey := "" -}}
{{- if not .Values.cluster.certManager.enabled -}}
{{- $apiSvcName := "api" -}}
{{- $apiFullName := printf "%s.%s.svc" $apiSvcName $ns -}}
{{- $apiAltNames := list
    (printf "%s" $apiFullName)
    (printf "%s.cluster.local" $apiFullName)
    (printf "%s.%s" $apiSvcName $ns)
    (printf "%s" $apiSvcName) -}}
{{- $grpcCA := genCA (printf "%s-clusterguard ca" $ns) $certValid -}}
{{- $grpcServerCert := genSignedCert $apiFullName nil $apiAltNames $certValid $grpcCA -}}
{{- $grpcClientCert := genSignedCert "falcon-sensor-client" nil (list (printf "URI:spiffe://cluster.local/ns/%s/sa/falcon-sensor" $ns)) $certValid $grpcCA -}}
{{- $grpcCACert = $grpcCA.Cert | b64enc -}}
{{- $grpcServerCrt = $grpcServerCert.Cert | b64enc -}}
{{- $grpcServerKey = $grpcServerCert.Key | b64enc -}}
{{- $grpcClientCrt = $grpcClientCert.Cert | b64enc -}}
{{- $grpcClientKey = $grpcClientCert.Key | b64enc -}}
{{- end -}}

{{- $imagePullSecret := include "falcon-clusterguard.imagePullSecret" . -}}
{{- $registryConfigJson := include "falcon-clusterguard.registryConfigJson" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: falcon-cluster-sensor-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
    app: falcon-kac
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCert }}
{{- if not .Values.cluster.certManager.enabled }}
---
# Node sensor client cert — signed by the gRPC CA, separate from the webhook cert.
apiVersion: v1
kind: Secret
metadata:
  name: falcon-node-sensor-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
type: kubernetes.io/tls
data:
  tls.crt: {{ $grpcClientCrt }}
  tls.key: {{ $grpcClientKey }}
---
# gRPC server cert for falcon-watcher — signed by its own CA.
apiVersion: v1
kind: Secret
metadata:
  name: falcon-api-tls
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
type: kubernetes.io/tls
data:
  tls.crt: {{ $grpcServerCrt }}
  tls.key: {{ $grpcServerKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: falcon-api-ca
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
type: Opaque
data:
  ca.crt: {{ $grpcCACert }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: clusterguard
    {{- range $key, $value := .Values.cluster.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- with .Values.cluster.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ .Values.cluster.replicas }}
  selector:
    matchLabels:
      {{- include "falcon-clusterguard.clusterSensorSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "falcon-clusterguard.labels" . | nindent 8 }}
        {{- include "falcon-clusterguard.clusterSensorSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clusterguard
        {{- range $key, $value := .Values.cluster.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.cluster.podLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        sensor.falcon-system.crowdstrike.com/injection: disabled
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        {{- if and (include "falcon-clusterguard.openshiftEnabled" . | eq "true") .Values.cluster.hostNetwork }}
        openshift.io/scc: {{ include "falcon-clusterguard.admissionSccName" . }}
        {{- end }}
        {{- if .Values.cluster.autoDeploymentUpdate }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
        {{- range $key, $value := .Values.cluster.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if and $imagePullSecret $registryConfigJson }}
      {{- fail "image.pullSecrets and image.registryConfigJSON cannot be used together." }}
      {{- else if or $imagePullSecret $registryConfigJson }}
      imagePullSecrets:
        {{- if $imagePullSecret }}
        - name: {{ $imagePullSecret }}
        {{- end }}
        {{- if $registryConfigJson }}
        - name: {{ include "falcon-clusterguard.fullname" . }}-pull-secret
        {{- end }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "falcon-clusterguard.clusterServiceAccountName" . }}
      shareProcessNamespace: true
      {{- with .Values.cluster.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cluster.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cluster.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ default "ClusterFirstWithHostNet" .Values.cluster.dnsPolicy }}
      {{- else if .Values.cluster.dnsPolicy }}
      dnsPolicy: {{ .Values.cluster.dnsPolicy }}
      {{- end }}
      containers:
        - name: falcon-ac
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            - name: HELM_CHART
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['helm.sh/chart']
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.admissionConfigMapName" . }}
          {{- if .Values.falconSecret.enabled }}
            - secretRef:
                name: {{ .Values.falconSecret.secretName }}
          {{- end }}
          resources:
            {{- toYaml .Values.cluster.resources.ac | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz-kac
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez-kac
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
            - name: crowdstrike-falcon-vol2
              mountPath: /var/falcon-watcher
        - name: falcon-client
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - client
            - "-port={{ .Values.cluster.webhookPort }}"
          env:
            - name: __CS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: __CS_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: __CS_POD_NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: HELM_CHART
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['helm.sh/chart']
            {{- if .Values.falconImageAnalyzerNamespace }}
            - name: __CS_IAR_NAMESPACE
              value: {{ .Values.falconImageAnalyzerNamespace | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.admissionConfigMapName" . }}
            {{- if .Values.falconSecret.enabled }}
            - secretRef:
                name: {{ .Values.falconSecret.secretName }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.cluster.webhookPort }}
              name: webhook-port
          resources:
            {{- toYaml .Values.cluster.resources.client | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: {{ .Values.cluster.webhookPort }}
              scheme: HTTPS
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: falcon-cluster-sensor-tls-certs
              mountPath: /run/secrets/tls
              readOnly: true
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
        - name: falcon-watcher
          image: {{ include "falcon-clusterguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - "client"
            - "-app=watcher"
            - "-http-port={{ .Values.cluster.watcherPort }}"
          env:
            - name: __CS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: __CS_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: __CS_POD_NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: HELM_CHART
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['helm.sh/chart']
          envFrom:
            - configMapRef:
                name: {{ include "falcon-clusterguard.admissionConfigMapName" . }}
            {{- if .Values.falconSecret.enabled }}
            - secretRef:
                name: {{ .Values.falconSecret.secretName }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.cluster.watcherPort }}
              name: healthcheck
            - containerPort: 50051
              name: grpc-port
              protocol: TCP
          resources:
            {{- toYaml .Values.cluster.resources.watcher | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /startz
              port: {{ .Values.cluster.watcherPort }}
              scheme: HTTP
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: {{ .Values.cluster.watcherPort }}
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: crowdstrike-falcon-vol0
              mountPath: /tmp
            - name: crowdstrike-falcon-vol1
              mountPath: /var/private
            - name: crowdstrike-falcon-vol2
              mountPath: /var/falcon-watcher
            - name: falcon-api-tls-certs
              mountPath: /run/secrets/tls
              readOnly: true
            - name: falcon-api-ca
              mountPath: /run/secrets/ca
              readOnly: true
      volumes:
        - name: falcon-cluster-sensor-tls-certs
          secret:
            secretName: falcon-cluster-sensor-tls
        - name: falcon-api-tls-certs
          secret:
            secretName: falcon-api-tls
        - name: falcon-api-ca
          secret:
            secretName: falcon-api-ca
        - name: crowdstrike-falcon-vol0
          emptyDir:
            sizeLimit: 256Mi
        - name: crowdstrike-falcon-vol1
          emptyDir:
            sizeLimit: 4Ki
        - name: crowdstrike-falcon-vol2
          emptyDir:
            sizeLimit: 64Mi

---
{{- if eq (include "falcon-clusterguard.admissionControlEnabled" .) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating.falcon-kac.crowdstrike.com
  labels:
    {{- include "falcon-clusterguard.labels" . | nindent 4 }}
webhooks:
- name: validating.{{ include "falcon-clusterguard.webhookName" . }}
  admissionReviewVersions:
    - v1
  matchPolicy: Equivalent
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - {{ $ns }}
          - kube-system
          - kube-public
          - falcon-system
          - falcon-kubernetes-protection
          {{- if .Values.cluster.webhook.disableNamespaces }}
          {{- range splitList "," .Values.cluster.webhook.disableNamespaces }}
          - {{ . | trim }}
          {{- end }}
          {{- end }}
          {{ include "falcon-clusterguard.openshiftNamespaces" . | nindent 10 }}
      - key: {{ include "falcon-clusterguard.webhookName" . }}/admission-review
        operator: NotIn
        values:
          - disabled
  clientConfig:
    caBundle: {{ $caCert }}
    {{- if .Values.cluster.domainName }}
    url: https://{{ $webhookFullName }}:443/validate
    {{- else }}
    service:
      name: webhook
      namespace: {{ $ns }}
      path: "/validate"
    {{- end }}
  failurePolicy: {{ .Values.cluster.webhook.failurePolicy }}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
    - pods/ephemeralcontainers
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- name: workload.validating.falcon-kac.crowdstrike.com
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ $caCert }}
    {{- if .Values.cluster.domainName }}
    url: https://{{ $webhookFullName }}:443/validate
    {{- else }}
    service:
      name: webhook
      namespace: {{ $ns }}
      path: /validate
    {{- end }}
  failurePolicy: Ignore
  matchPolicy: Equivalent
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - {{ $ns }}
          - kube-system
          - kube-public
          - falcon-system
          - falcon-kubernetes-protection
          {{- if .Values.cluster.webhook.disableNamespaces }}
          {{- range splitList "," .Values.cluster.webhook.disableNamespaces }}
          - {{ . | trim }}
          {{- end }}
          {{- end }}
          {{- include "falcon-clusterguard.openshiftNamespaces" . | nindent 10 }}
      - key: {{ include "falcon-clusterguard.webhookName" . }}/admission-review
        operator: NotIn
        values:
          - disabled
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - replicationcontrollers
    - services
    scope: '*'
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cronjobs
    - jobs
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
{{- end }}
{{- end }}
